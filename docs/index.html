<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sd2vec-hybrid 比較検索</title>
<style>
:root { color-scheme: light; --ink:#172033; --muted:#687386; --line:#dce2eb; --accent:#4263eb; --soft:#f5f7fb; }
* { box-sizing:border-box; }
body { margin:0; background:var(--soft); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif; }
main { max-width:1120px; margin:0 auto; padding:32px 18px 64px; }
h1 { margin:0 0 8px; font-size:clamp(26px,4vw,40px); }
h2 { margin:0 0 14px; font-size:20px; }
p { color:var(--muted); line-height:1.7; }
.hero { margin-bottom:24px; }
.card { background:white; border:1px solid var(--line); border-radius:16px; padding:20px; margin:16px 0; box-shadow:0 4px 16px #1720330a; }
.form { display:flex; gap:10px; align-items:end; flex-wrap:wrap; }
label { display:block; color:var(--muted); font-size:13px; margin-bottom:6px; }
input { width:200px; border:1px solid #b9c2d0; border-radius:9px; padding:12px; font-size:17px; }
button { border:0; border-radius:9px; padding:12px 18px; background:var(--accent); color:white; cursor:pointer; font-size:15px; font-weight:600; }
button:hover { filter:brightness(.94); }
.error { background:#fff0f1; color:#a61e2b; border:1px solid #ffc9ce; padding:12px; border-radius:9px; }
.grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
.panel { border:1px solid var(--line); border-radius:12px; padding:14px; }
.panel h3 { margin:0 0 5px; font-size:16px; }
.panel p { font-size:13px; margin:0 0 12px; }
.word { padding:8px 0; border-top:1px solid var(--line); display:flex; justify-content:space-between; }
.word:first-of-type { border-top:0; }
.word span:last-child { color:var(--muted); font-size:12px; }
.hidden { display:none; }
@media(max-width:760px) { .grid { grid-template-columns:1fr; } main { padding-top:20px; } }
</style>
</head>
<body>
<main>
  <section class="hero">
    <h1>sd2vec-hybrid 比較検索</h1>
    <p>sd2vec（SD尺度）とchiVe（文脈的意味）を結合したハイブリッドベクトルの最近傍検索を比較します。</p>
  </section>
  <section class="card">
    <div class="form">
      <div><label for="query">検索語</label><input id="query" value="猫" list="words"></div>
      <button onclick="search()">検索</button>
    </div>
    <datalist id="words"></datalist>
    <div id="error" class="error hidden"></div>
  </section>
  <section id="result" class="hidden">
    <div class="grid">
      <div class="panel"><h3>sd2vec</h3><p>SD尺度ベースの評価的意味</p><div id="sd2vec"></div></div>
      <div class="panel"><h3>chiVe</h3><p>文脈的意味ベース</p><div id="chive"></div></div>
      <div class="panel"><h3>hybrid</h3><p>sd2vec + chiVe 結合</p><div id="hybrid"></div></div>
    </div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
// DATA: { words, index(Map), sd(Float32Array), w2v(Float32Array), sdDim, w2vDim }
// sd / w2v は行ごとに L2 正規化済み。hybrid(連結)のコサイン類似度は (sd内積 + w2v内積) / 2 と等価。
let DATA = null;

function decodeF16(buf) {
  const u16 = new Uint16Array(buf);
  const out = new Float32Array(u16.length);
  for (let i = 0; i < u16.length; i++) {
    const h = u16[i], s = (h & 0x8000) ? -1 : 1, e = (h >> 10) & 0x1f, f = h & 0x3ff;
    out[i] = e === 0 ? s * Math.pow(2, -14) * (f / 1024)
           : e === 31 ? (f ? NaN : s * Infinity)
           : s * Math.pow(2, e - 15) * (1 + f / 1024);
  }
  return out;
}

function dotRow(mat, dim, qi, i) {
  let s = 0;
  const a = qi * dim, b = i * dim;
  for (let k = 0; k < dim; k++) s += mat[a + k] * mat[b + k];
  return s;
}

function mostSimilar(query, kind, topn=10) {
  const qi = DATA.index.get(query);
  if (qi === undefined) return [];
  const n = DATA.words.length;
  const scores = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const sd = kind === 'chive' ? 0 : dotRow(DATA.sd, DATA.sdDim, qi, i);
    const w = kind === 'sd2vec' ? 0 : dotRow(DATA.w2v, DATA.w2vDim, qi, i);
    scores[i] = kind === 'sd2vec' ? sd : kind === 'chive' ? w : (sd + w) / 2;
  }
  const order = Array.from({ length: n }, (_, i) => i).sort((a, b) => scores[b] - scores[a]);
  return order.filter(i => i !== qi).slice(0, topn).map(i => ({ word: DATA.words[i], score: scores[i] }));
}

function renderList(id, results) {
  $(id).innerHTML = results.length
    ? results.map(r => `<div class="word"><span>${r.word}</span><span>${r.score.toFixed(4)}</span></div>`).join('')
    : '<p>該当する語はありません。</p>';
}

function search() {
  const q = $('query').value.trim();
  $('error').classList.add('hidden');
  if (!DATA) return;
  if (!DATA.index.has(q)) {
    $('error').textContent = `'${q}' は語彙(${DATA.words.length.toLocaleString()}語)に含まれていません。`;
    $('error').classList.remove('hidden');
    $('result').classList.add('hidden');
    return;
  }
  $('result').classList.remove('hidden');
  renderList('sd2vec', mostSimilar(q, 'sd2vec'));
  renderList('chive', mostSimilar(q, 'chive'));
  renderList('hybrid', mostSimilar(q, 'hybrid'));
}

// 1万語を datalist に全て入れると重いため、入力に前方一致する候補だけを最大50件表示する
$('query').addEventListener('input', () => {
  if (!DATA) return;
  const p = $('query').value.trim();
  $('words').innerHTML = p
    ? DATA.words.filter(w => w.startsWith(p)).slice(0, 50).map(w => `<option value="${w}">`).join('')
    : '';
});
$('query').addEventListener('keydown', e => { if (e.key === 'Enter') search(); });

Promise.all([
  fetch('meta.json').then(r => r.json()),
  fetch('words.json').then(r => r.json()),
  fetch('sd.f16').then(r => r.arrayBuffer()),
  fetch('w2v.f16').then(r => r.arrayBuffer()),
]).then(([meta, words, sd, w2v]) => {
  DATA = {
    words, sdDim: meta.sd_dim, w2vDim: meta.w2v_dim,
    index: new Map(words.map((w, i) => [w, i])),
    sd: decodeF16(sd), w2v: decodeF16(w2v),
  };
  search();
}).catch(err => {
  $('error').textContent = `データの読み込みに失敗しました: ${err}`;
  $('error').classList.remove('hidden');
});
</script>
</body>
</html>
