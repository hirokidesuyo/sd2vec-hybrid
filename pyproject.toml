[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sd2vec-hybrid"
version = "0.1.0"
description = "Hybrid vector representation combining sd2vec and word2vec"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
    "sd2vec>=0.1.0",
    "gensim>=4.0.0",
]

[project.scripts]
sd2vec-hybrid-neighbors = "sd2vec_hybrid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
